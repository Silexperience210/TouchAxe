; TouchAxe — PlatformIO configuration
;
; Note: upload_port is deliberately NOT set. PlatformIO auto-detects the board,
; and hardcoding a COM port breaks the build for every other contributor.
; Override locally with:  pio run -t upload --upload-port COM19
; or in a git-ignored platformio_local.ini.

[env:esp32-4827S043C]
platform = espressif32@6.9.0   ; pinned: an unpinned platform is why this repo stopped building
board = esp32-4827S043C
framework = arduino

monitor_speed = 115200
upload_speed = 921600

extra_scripts = pre:tools/pio/exclude_arm_asm.py

lib_deps =
    lvgl/lvgl@^9.4.0
    bblanchon/ArduinoJson@^7.0.4
    contrem/arduino-timer@^3.0.1
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git

build_flags =
    ; LVGL must be able to find our lv_conf.h when the *library* is compiled,
    ; not just the project sources. Without these two flags lv_conf_internal.h
    ; falls back to "../../lv_conf.h" and the build dies on lv_group.c.
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CORE_DEBUG_LEVEL=0
    -D BOARD_HAS_PSRAM
    -D LV_HOR_RES_MAX=480
    -D LV_VER_RES_MAX=272
    -D CONFIG_ESP32S3_SPIRAM_SUPPORT
    -D ARDUINO_EVENT_RUNNING_CORE=0   ; WiFi/event stack on core 0
    -D ARDUINO_RUNNING_CORE=1         ; Arduino loop + LVGL render on core 1
    -D FIRMWARE_VERSION='"1.3.0"'
    -O2

; -mfix-esp32-psram-cache-issue was removed: it is an ESP32-classic silicon
; workaround and has no effect on the S3, where it only costs code size.

build_type = release

board_build.partitions = default_8MB.csv
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.psram_type = qspi

monitor_filters = esp32_exception_decoder, time, log2file

[env:esp32-4827S043C-debug]
extends = env:esp32-4827S043C
build_type = debug
build_flags =
    ${env:esp32-4827S043C.build_flags}
    -D CORE_DEBUG_LEVEL=3
